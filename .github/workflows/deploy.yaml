name: Deploy to ECR and EKS

on: 
  push:
    branches: [ main ]

env:
  ECR_REPOSITORY: usecase-3-repo
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: cluster-10  
  KUBERNETES_NAMESPACE: default

jobs:
  build:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
    - name: Set short git commit SHA
      id: commit
      uses: prompt/actions-commit-hash@v2

    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ steps.commit.outputs.short }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update kubeconfig
      run: |
        aws eks --region $AWS_REGION update-kubeconfig --name $EKS_CLUSTER_NAME  # This is set to 'cluster-10'

    - name: Set kubectl context to EKS cluster
      run: kubectl config use-context arn:aws:eks:$AWS_REGION:$AWS_ACCOUNT_ID:cluster/$EKS_CLUSTER_NAME  # This is set to 'cluster-10'

    - name: Deploy to EKS
      run: |
        kubectl set image deployment/your-deployment-name -n $KUBERNETES_NAMESPACE your-container-name=$ECR_REGISTRY/$ECR_REPOSITORY:latest  # Replace 'your-deployment-name' and 'your-container-name' with your actual deployment and container names
