apiVersion: apps/v1 
kind: Deployment
metadata:
  name: regapp-deployment2
  labels: 
     app: webapp

spec:
  replicas: 2 
  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: 741448935198.dkr.ecr.ap-south-1.amazonaws.com/shnewecr:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
